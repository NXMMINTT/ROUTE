<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>เดโม: รถวิ่งตามถนนโค้ง</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,700;125,800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF; --ink:#0B0C0D; --dim:#9AA0A6; --road:#0C0D0F; --paint:#3A3C40;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#0E1012; --ink:#F2F4F6; --dim:#6E767D; --road:#000; --paint:#2A2D31; } }
:root[data-theme="dark"]{ --bg:#0E1012; --ink:#F2F4F6; --dim:#6E767D; --road:#000; --paint:#2A2D31; }
*,*::before,*::after{box-sizing:inherit}
html{overflow-x:hidden;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}
.drive{position:relative;height:760vh}
.stage{position:sticky;top:0;height:100vh;height:100dvh;overflow:hidden;background:var(--bg)}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
.speed{position:absolute;left:5vw;top:clamp(1.2rem,4vh,2.4rem);z-index:3;font-family:Archivo,sans-serif;font-stretch:125%;font-weight:800;font-size:.8rem;letter-spacing:.1em;color:var(--ink);font-variant-numeric:tabular-nums}
.word{position:absolute;left:5vw;bottom:6vh;z-index:3;font-family:Archivo,sans-serif;font-stretch:125%;font-weight:700;font-size:clamp(2.6rem,8vw,7rem);line-height:.92;color:var(--dim);max-width:45vw;will-change:transform,opacity}
.word small{display:block;font-family:Inter,sans-serif;font-weight:400;font-size:clamp(.85rem,1.1vw,1rem);color:var(--dim);max-width:24rem;margin-top:1rem;line-height:1.6}
.hint{position:absolute;right:5vw;bottom:6vh;z-index:3;color:var(--dim);font-size:.8rem;letter-spacing:.1em}
.after{padding:16vh 6vw 20vh;background:var(--ink);color:var(--bg)}
.after h2{font-family:Archivo,sans-serif;font-stretch:125%;font-size:clamp(1.4rem,3vw,2.4rem);margin:0 0 1rem}
.nogl{position:absolute;left:5vw;top:40%;z-index:4;display:none;color:var(--dim)}
</style>
</head>
<body>
<section class="drive" id="drive">
  <div class="stage" id="stage">
    <canvas id="gl" role="img" aria-label="รถบรรทุกวิ่งตามถนนโค้ง มองจากด้านบน"></canvas>
    <div class="speed"><span id="kmh">00</span> KM/H</div>
    <div class="word" id="word"><span id="wordText">RELIABILITY</span><small id="wordSub">ทุกเส้นทางคำนวณล่วงหน้า ถึงตรงเวลาแม้ต้องเลี้ยวหลายทอด</small></div>
    <div class="hint">SCROLL ↓</div>
    <p class="nogl" id="nogl">เบราว์เซอร์นี้แสดงภาพ 3D ไม่ได้</p>
  </div>
</section>
<section class="after"><h2>Next section</h2><p>เลื่อนขึ้นเพื่อให้รถถอยกลับตามเส้นทางเดิม</p></section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  const $=i=>document.getElementById(i);
  if(!window.THREE){ $('nogl').style.display='block'; return; }
  const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const clamp=(v,a,b)=>Math.min(b,Math.max(a,v)), lerp=(a,b,t)=>a+(b-a)*t, seg=(p,a,b)=>clamp((p-a)/(b-a),0,1);
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const lin=c=>new THREE.Color(c).convertSRGBToLinear();

  let renderer; try{ renderer=new THREE.WebGLRenderer({canvas:$('gl'),antialias:true,alpha:true}); }
  catch(e){ $('nogl').style.display='block'; return; }
  renderer.setPixelRatio(Math.min(devicePixelRatio||1,2)); renderer.outputEncoding=THREE.sRGBEncoding;
  const scene=new THREE.Scene();
  const camera=new THREE.OrthographicCamera(-1,1,1,-1,.1,800);
  const rig=new THREE.Object3D(); scene.add(rig); rig.add(camera);
  camera.position.set(0,200,0); camera.rotation.x=-Math.PI/2;   // top-down
  scene.add(new THREE.HemisphereLight(0xffffff,0x555555,.9));
  const sun=new THREE.DirectionalLight(0xffffff,.7); sun.position.set(-40,120,60); scene.add(sun);

  // ---------- the path everything follows ----------
  const PTS=[[-520,0],[-260,0],[-90,0],[-20,6],[18,60],[30,150],[34,330],[36,620]].map(([x,z])=>new THREE.Vector3(x,0,z));
  const curve=new THREE.CatmullRomCurve3(PTS,false,'centripetal',.5);
  const LEN=curve.getLength();
  const RW=26;                                   // road width

  // road ribbon built from the same curve
  function ribbon(curve,width,y,mat,segments){
    const pos=[],idx=[]; const up=new THREE.Vector3(0,1,0);
    for(let i=0;i<=segments;i++){
      const t=i/segments, p=curve.getPointAt(t), tan=curve.getTangentAt(t);
      const n=new THREE.Vector3().crossVectors(up,tan).normalize().multiplyScalar(width/2);
      pos.push(p.x-n.x,y,p.z-n.z, p.x+n.x,y,p.z+n.z);
      if(i<segments){ const a=i*2; idx.push(a,a+1,a+2, a+1,a+3,a+2); }
    }
    const g=new THREE.BufferGeometry();
    g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3)); g.setIndex(idx); g.computeVertexNormals();
    return new THREE.Mesh(g,mat);
  }
  const roadMat=new THREE.MeshBasicMaterial({color:lin(css('--road')),side:THREE.DoubleSide});
  const paintMat=new THREE.MeshBasicMaterial({color:lin(css('--paint')),side:THREE.DoubleSide});
  scene.add(ribbon(curve,RW,0,roadMat,600));

  // a branch road, so the junction reads like a real intersection
  const branch=new THREE.CatmullRomCurve3([[18,60],[120,66],[300,70],[560,74]].map(([x,z])=>new THREE.Vector3(x,0,z)),false,'centripetal',.5);
  scene.add(ribbon(branch,RW,0,roadMat,200));

  // dashed markings along both roads
  function dashes(curve,offset,len,gap,w){
    const total=curve.getLength(), n=Math.floor(total/gap), g=new THREE.PlaneGeometry(w,len);
    const up=new THREE.Vector3(0,1,0);
    for(let i=0;i<n;i++){
      const t=(i*gap+gap/2)/total; if(t>1) break;
      const p=curve.getPointAt(t), tan=curve.getTangentAt(t);
      const nrm=new THREE.Vector3().crossVectors(up,tan).normalize().multiplyScalar(offset);
      const m=new THREE.Mesh(g,paintMat);
      m.position.set(p.x+nrm.x,.02,p.z+nrm.z);
      m.rotation.set(-Math.PI/2,0,-Math.atan2(tan.x,tan.z));
      scene.add(m);
    }
  }
  [0,RW*.33,-RW*.33].forEach(o=>dashes(curve,o,6,26,.45));
  [0,RW*.33,-RW*.33].forEach(o=>dashes(branch,o,6,26,.45));

  // ---------- truck (points toward +x locally) ----------
  const L=17;
  const truck=new THREE.Group(); scene.add(truck);
  const black=new THREE.MeshLambertMaterial({color:lin('#141618')}), silver=new THREE.MeshLambertMaterial({color:lin('#D7D9DC')}),
        roof=new THREE.MeshLambertMaterial({color:lin('#B9BCC0')}), glassM=new THREE.MeshLambertMaterial({color:lin('#2C3338')});
  const bx=(w,h,d,m,x,y,z,par)=>{const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);b.position.set(x,y,z);par.add(b);return b;};
  bx(11.4,2.6,4.2,silver,-2.2,2.6,0,truck);            // container
  bx(11.0,.06,3.9,roof,-2.2,3.92,0,truck);
  bx(15.5,.5,3.4,black,-1.0,1.1,0,truck);              // chassis
  const cab=new THREE.Group(); truck.add(cab);
  bx(3.4,2.9,4.2,black,5.4,2.5,0,cab);
  bx(1.0,1.2,4.0,black,7.6,1.6,0,cab);
  bx(.15,1.0,3.6,glassM,7.1,2.9,0,cab);
  [2.3,-2.3].forEach(z=>bx(.5,.3,.7,black,6.6,2.6,z,cab));
  const wheels=[], WR=.95;
  const tg=new THREE.CylinderGeometry(WR,WR,.8,20);
  [-6.6,-4.8,4.3,6.6].forEach(x=>[1.7,-1.7].forEach(z=>{
    const w=new THREE.Group(); w.position.set(x,WR,z);
    const t=new THREE.Mesh(tg,black); t.rotation.x=Math.PI/2; w.add(t);
    truck.add(w); wheels.push(w);
  }));
  const shadow=new THREE.Mesh(new THREE.PlaneGeometry(L+1,5),new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:.25}));
  shadow.rotation.x=-Math.PI/2; shadow.position.y=.03; truck.add(shadow);

  // ---------- layout ----------
  function resize(){
    const st=$('stage'), w=st.clientWidth, h=st.clientHeight, aspect=w/h;
    renderer.setSize(w,h,false);
    const visW=(aspect<1? L/.55 : L/.28);          // truck fills ~28% of the width on desktop
    const visH=visW/aspect;
    camera.left=-visW/2; camera.right=visW/2; camera.top=visH/2; camera.bottom=-visH/2; camera.updateProjectionMatrix();
  }
  addEventListener('resize',resize); resize();

  // ---------- scroll ----------
  const drive=$('drive'), kmh=$('kmh'), word=$('word'), wordText=$('wordText'), wordSub=$('wordSub');
  const STOPS=[
    {at:.20,title:'RELIABILITY',sub:'ทุกเส้นทางคำนวณล่วงหน้า ถึงตรงเวลาแม้ต้องเลี้ยวหลายทอด'},
    {at:.55,title:'VISIBILITY',sub:'รู้ตำแหน่งรถทุกคันแบบเรียลไทม์ ตั้งแต่ออกจากคลังจนถึงมือผู้รับ'},
    {at:.85,title:'PROOF',sub:'ลายเซ็นและรูปถ่ายหน้างานส่งกลับศูนย์ทันทีที่ส่งเสร็จ'}
  ];
  const target=()=>{const r=drive.getBoundingClientRect();return clamp(-r.top/(drive.offsetHeight-innerHeight),0,1);};
  let p=null,last=null,spd=0,shown=-1;
  const up=new THREE.Vector3(0,1,0);
  function frame(){
    const tp=target(); p=(p===null||reduce)?tp:p+(tp-p)*.1;
    const t=clamp(p,0,1);
    const pos=curve.getPointAt(t), tan=curve.getTangentAt(t);

    truck.position.set(pos.x,0,pos.z);
    truck.rotation.y=Math.atan2(-tan.z,tan.x);      // nose always follows the road
    rig.position.set(pos.x,0,pos.z);                // camera rides above the truck

    const dist=t*LEN, dd=last===null?0:dist-last; last=dist;
    wheels.forEach(w=>w.rotation.z=-dist/WR);
    spd+=(clamp(Math.abs(dd)*1.1,0,120)-spd)*.08; if(spd<.5) spd=0;
    kmh.textContent=String(Math.round(spd)).padStart(2,'0');

    let i=0; STOPS.forEach((s,k)=>{ if(t>=s.at-.18) i=k; });
    if(i!==shown){ shown=i; wordText.textContent=STOPS[i].title; wordSub.textContent=STOPS[i].sub; }
    const near=STOPS[i]; const d=Math.abs(t-near.at);
    const vis=clamp(1-d/.16,0,1);
    word.style.opacity=vis; word.style.transform=`translateY(${(1-vis)*26}px)`;

    renderer.render(scene,camera);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
